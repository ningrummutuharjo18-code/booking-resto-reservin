<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daftar | Reservin</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="register.css">
    </head>
    <body>

        <!-- HEADER -->
        <header class="header">
            <a class="brand" href="guest.html">
                <span class="brand_logo">
                    <img src="Ikon-aplikasi.png" alt="Ikon Reservin" class="ikon">
                </span>
                <span class="brand_nama">Reservin</span>
            </a>
        </header>

        <!-- ISI HALAMAN -->
        <main class="halaman_register latar_gradasi">
            <span class="cahaya a"></span>
            <span class="cahaya b"></span>
            <h1 class="register_judul">Buat Akun Baru</h1>
            <form class="kartu kartu_register" id="form_auth" novalidate>
                <h2 class="kartu_judul">Buat Akun</h2>
                <div class="register_fields">
                    <div class="field">
                        <label for="username">Username</label>
                        <input class="input" id="username" name="username" type="text" placeholder="Masukkan username" autocomplete="username" required>
                    </div>
                    <div class="field">
                        <label for="sandi">Password</label>
                        <div class="input_sandi">
                            <input class="input" id="sandi" name="sandi" type="password" placeholder="Masukkan password" autocomplete="current-password" required>
                           <button class="btn_mata tersembunyi" id="btn_mata" type="button" aria-label="Tampilkan password">
    <svg class="ikon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
        <circle cx="12" cy="12" r="3"/>
        <line class="garis_miring" x1="3" y1="3" x2="21" y2="21"/>
    </svg>
</button>
                        </div>
                        <a class="tautan_kecil" href="login.html">Sudah punya akun? Masuk</a>
                    </div>
                    <p class="pesan_error" id="pesan_error"></p>
                </div>
                <div class="register_tombol">
                    <button class="btn btn_utama" type="submit">Daftar</button>
                </div>
            </form>
        </main>

        <!-- PESAN KECIL (toast) -->
        <div class="toast" id="toast"></div>

        <!-- JAVASCRIPT (urutan jangan diubah: data -> common -> halaman ini) -->
        <script src="data.js"></script>
        <script src="common.js"></script>
        <script src="register.js"></script>
    </body>
</html>
