<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detail Booking | Reservin</title>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="detail_reservasi.css">
        <link rel="stylesheet" href="admin.css">
    </head>
    <body>

        <!-- HEADER -->
        <header class="header">
            <a class="brand" href="dashboard_super_admin.html">
                <span class="brand_logo">
                    <img src="Ikon-aplikasi.png" alt="Ikon Reservin" class="ikon">
                </span>
                <span class="brand_nama">Reservin</span>
            </a>
            <nav class="nav_admin">
                <a class="nav_item" href="dashboard_super_admin.html">Beranda</a>
                <a class="nav_item" href="daftar_resto.html">Daftar Resto</a>
                <a class="nav_item" href="daftar_user.html">Daftar User</a>
                <a class="nav_item aktif" href="daftar_reservasi.html">Riwayat Booking</a>
            </nav>
            <button class="btn_ikon_header" id="btn_keluar_admin" type="button">
                <span class="ikon">🚪</span>
            </button>
        </header>

        <!-- ISI HALAMAN -->
        <main class="konten">
            <div class="baris_kembali">
                <a class="btn_kembali" href="daftar_reservasi.html">
                    <span class="ikon">‹</span>
                </a>
                <h1 class="judul_halaman">Detail Reservasi</h1>
            </div>
            <p class="bantuan" id="info_resto"></p>
            <div class="kartu kartu_detail">
                <div class="kepala_kartu">
                    <h2>Informasi Reservasi</h2>
                    <span class="badge_status status_menunggu" id="badge_status">Menunggu konfirmasi</span>
                </div>
                <hr class="pemisah">
                <div class="grid_info">
                    <div class="info_item">
                        <span class="lencana_ikon">
                            <span class="ikon">📅</span>
                        </span>
                        <div>
                            <p class="info_label">Tanggal</p>
                            <p class="info_nilai" id="d_tanggal"></p>
                        </div>
                    </div>
                    <div class="info_item">
                        <span class="lencana_ikon">
                            <span class="ikon">🕐</span>
                        </span>
                        <div>
                            <p class="info_label">Jam</p>
                            <p class="info_nilai" id="d_jam"></p>
                        </div>
                    </div>
                    <div class="info_item">
                        <span class="lencana_ikon">
                            <span class="ikon">👤</span>
                        </span>
                        <div>
                            <p class="info_label">Jumlah Tamu</p>
                            <p class="info_nilai" id="d_tamu"></p>
                        </div>
                    </div>
                    <div class="info_item">
                        <span class="lencana_ikon">
                            <span class="ikon">📞</span>
                        </span>
                        <div>
                            <p class="info_label">No HP</p>
                            <p class="info_nilai" id="d_hp"></p>
                        </div>
                    </div>
                    <div class="info_item">
                        <span class="lencana_ikon">
                            <span class="ikon">👤</span>
                        </span>
                        <div>
                            <p class="info_label">Atas Nama</p>
                            <p class="info_nilai" id="d_nama"></p>
                        </div>
                    </div>
                </div>
                <div class="blok_catatan">
                    <p class="label_catatan">Catatan</p>
                    <div class="kotak_catatan" id="d_catatan"></div>
                </div>
            </div>
        </main>

        <!-- POPUP LOGOUT -->
        <div class="overlay tengah" id="popup_logout">
            <div class="popup kecil">
                <div>
                    <h2 class="popup_judul" id="judul_logout">Keluar dari Reservin?</h2>
                    <p class="popup_sub">Yakin mau logout? Kamu perlu login lagi untuk memakai Reservin.</p>
                </div>
                <div class="popup_aksi tengah">
                    <button class="btn btn_garis lebar_190px" id="btn_logout_batal" type="button">Batal</button>
                    <button class="btn btn_bahaya lebar_170px" id="btn_logout_ya" type="button">Keluar</button>
                </div>
            </div>
        </div>

        <!-- PESAN KECIL (toast) -->
        <div class="toast" id="toast"></div>

        <!-- JAVASCRIPT (urutan jangan diubah: data -> common -> halaman ini) -->
        <script src="data.js"></script>
        <script src="common.js"></script>
        <script src="detail_reservasi.js"></script>
    </body>
</html>
